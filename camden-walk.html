<title>Camden Walk — Two Cages, One Sound</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#0a0a0a;color:#f2ede4;font-family:Georgia,serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:16px;touch-action:manipulation;
  }
  .back-link{color:#8a8580;text-decoration:none;font-size:0.8rem;align-self:flex-start;margin-bottom:10px;}
  .back-link:hover{color:#e6394a;}
  h1{font-size:1.3rem;color:#fff;margin-bottom:4px;}
  .sub{color:#8a8580;font-size:0.75rem;font-style:italic;margin-bottom:14px;}

  #gameWorld{
    position:relative;
    width:100%;max-width:400px;
    height:460px;
    background:
      linear-gradient(0deg, #1c1a17 0%, #1c1a17 100%);
    background-color:#26221d;
    border:3px solid #3a3632;
    border-radius:6px;
    overflow:hidden;
  }
  .street{
    position:absolute;background:#1a1815;
  }
  .street.h{height:70px;width:100%;top:195px;}
  .street.v{width:70px;height:100%;left:165px;}
  .building{
    position:absolute;background:#2e2a25;border:1px solid #3a3632;
    display:flex;align-items:center;justify-content:center;
    font-size:0.62rem;color:#8a8580;text-align:center;padding:4px;
    line-height:1.2;
  }
  .hotspot{
    position:absolute;width:34px;height:34px;
    background:#c41e2a;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;
    box-shadow:0 0 12px rgba(196,30,42,0.7);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.15); }
  }

  const world = document.getElementById('gameWorld');
  const player = document.getElementById('player');
  let px = 180, py = 205;
  const speed = 3.5;
  let moveDir = null;
  let moveInterval = null;
  const visited = new Set();

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function updatePlayerPos() {
    player.style.left = px + 'px';
    player.style.top = py + 'px';
    checkHotspots();
  }

  function startMove(dir) {
    moveDir = dir;
    if (moveInterval) clearInterval(moveInterval);
    moveInterval = setInterval(() => {
      const w = world.clientWidth, h = world.clientHeight;
      if (moveDir === 'up') py -= speed;
      if (moveDir === 'down') py += speed;
      if (moveDir === 'left') px -= speed;
      if (moveDir === 'right') px += speed;
      px = clamp(px, 0, w - 44);
      py = clamp(py, 0, h - 44);
      updatePlayerPos();
    }, 16);
  }
  function stopMove() {
    moveDir = null;
    if (moveInterval) clearInterval(moveInterval);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') startMove('up');
    if (e.key === 'ArrowDown') startMove('down');
    if (e.key === 'ArrowLeft') startMove('left');
    if (e.key === 'ArrowRight') startMove('right');
  });
  document.addEventListener('keyup', stopMove);

  document.querySelectorAll('#controls button').forEach(btn => {
    const dir = btn.getAttribute('data-dir');
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startMove(dir);
    }, { passive: false });
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      stopMove();
    }, { passive: false });
    btn.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      stopMove();
    }, { passive: false });
    btn.addEventListener('mousedown', () => startMove(dir));
    btn.addEventListener('mouseup', () => stopMove());
    btn.addEventListener('mouseleave', () => stopMove());
  });

  const hotspotEls = {
    camden: document.getElementById('hs-camden'),
    mixer: document.getElementById('hs-mixer'),
    prolog: document.getElementById('hs-prolog'),
    z7: document.getElementById('hs-z7')
  };

  function checkHotspots() {
    for (const key in hotspotEls) {
      if (visited.has(key)) continue;
      const el = hotspotEls[key];
      const wr = world.getBoundingClientRect();
      const hr = el.getBoundingClientRect();
      const hx = hr.left - wr.left + hr.width/2;
      const hy = hr.top - wr.top + hr.height/2;
      const dist = Math.hypot((px+22) - hx, (py+22) - hy);
      if (dist < 32) {
        visited.add(key);
        openModal(key);
      }
    }
  }

  function openModal(key) {
    stopMove();
    const s = stations[key];
    document.getElementById('modal-img').src = s.img;
    document.getElementById('modal-title').innerText = s.title;
    document.getElementById('modal-text').innerText = s.text;
    document.getElementById('modal').classList.add('show');
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  updatePlayerPos();
</script>
</body>
</html>
